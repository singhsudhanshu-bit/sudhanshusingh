<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>
    <style>
        .card {
            width: 250px;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ccc;
            text-align: center;
            font-family: Arial;
        }
        .card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }
        .card h2 {
            margin: 10px 0 5px;
        }
        .card p {
            margin: 4px 0;
        }
    </style>
</head>
<body>

<div class="card">
    <img src="https://via.placeholder.com/120" alt="Student Photo">
    <h2>John Doe</h2>
    <p><b>Class:</b> 10th</p>
    <p><b>Roll No:</b> 21</p>
    <p><b>School:</b> ABC Public School</p>
    <p><b>Email:</b> john@example.com</p>
</div>

</body>
</html>
